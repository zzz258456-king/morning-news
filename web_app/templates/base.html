<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>{{ title }} - 全能数据平台</title>
    <style>
        * { margin: 0; padding: 0; box-sizing: border-box; }
        body {
            font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, "Helvetica Neue", Arial, sans-serif;
            background: #f0f2f5;
            color: #333;
            line-height: 1.6;
        }
        .navbar {
            background: linear-gradient(135deg, #1a1a2e 0%, #16213e 100%);
            padding: 0 24px;
            display: flex;
            align-items: center;
            height: 64px;
            box-shadow: 0 2px 8px rgba(0,0,0,0.15);
            position: sticky;
            top: 0;
            z-index: 100;
        }
        .navbar .logo {
            color: #fff;
            font-size: 20px;
            font-weight: 700;
            text-decoration: none;
            margin-right: 40px;
        }
        .navbar .logo span { color: #64ffda; }
        .navbar a {
            color: rgba(255,255,255,0.8);
            text-decoration: none;
            padding: 8px 20px;
            border-radius: 6px;
            transition: all 0.3s;
            font-size: 14px;
        }
        .navbar a:hover, .navbar a.active {
            background: rgba(255,255,255,0.1);
            color: #64ffda;
        }
        .container { max-width: 1200px; margin: 24px auto; padding: 0 24px; }
        .card {
            background: #fff;
            border-radius: 12px;
            padding: 24px;
            margin-bottom: 20px;
            box-shadow: 0 2px 8px rgba(0,0,0,0.08);
        }
        .card h2 { font-size: 18px; margin-bottom: 16px; color: #1a1a2e; }
        .btn {
            display: inline-block;
            padding: 8px 20px;
            border-radius: 6px;
            border: none;
            cursor: pointer;
            font-size: 14px;
            transition: all 0.3s;
            text-decoration: none;
        }
        .btn-primary { background: #1890ff; color: #fff; }
        .btn-primary:hover { background: #40a9ff; }
        .btn-success { background: #52c41a; color: #fff; }
        .btn-success:hover { background: #73d13d; }
        .btn-danger { background: #ff4d4f; color: #fff; }
        .btn-danger:hover { background: #ff7875; }
        .btn-sm { padding: 4px 12px; font-size: 12px; }
        input, textarea, select {
            width: 100%;
            padding: 8px 12px;
            border: 1px solid #d9d9d9;
            border-radius: 6px;
            font-size: 14px;
            transition: border-color 0.3s;
        }
        input:focus, textarea:focus, select:focus {
            outline: none;
            border-color: #1890ff;
            box-shadow: 0 0 0 2px rgba(24,144,255,0.2);
        }
        label { display: block; margin-bottom: 4px; font-weight: 500; font-size: 14px; }
        .form-group { margin-bottom: 16px; }
        table {
            width: 100%;
            border-collapse: collapse;
            font-size: 14px;
        }
        th, td { padding: 10px 12px; text-align: left; border-bottom: 1px solid #f0f0f0; }
        th { background: #fafafa; font-weight: 600; }
        tr:hover { background: #f5f5f5; }
        .alert {
            padding: 12px 16px;
            border-radius: 6px;
            margin-bottom: 16px;
            font-size: 14px;
        }
        .alert-success { background: #f6ffed; border: 1px solid #b7eb8f; color: #52c41a; }
        .alert-error { background: #fff2f0; border: 1px solid #ffccc7; color: #ff4d4f; }
        .alert-info { background: #e6f7ff; border: 1px solid #91d5ff; color: #1890ff; }
        .loading {
            text-align: center; padding: 40px; color: #999;
        }
        .row { display: flex; gap: 20px; flex-wrap: wrap; }
        .col { flex: 1; min-width: 300px; }
        pre {
            background: #1e1e1e; color: #d4d4d4; padding: 16px;
            border-radius: 8px; overflow-x: auto; font-size: 13px;
        }
        img.chart { max-width: 100%; border-radius: 8px; border: 1px solid #f0f0f0; }
        .stats-grid {
            display: grid;
            grid-template-columns: repeat(auto-fit, minmax(200px, 1fr));
            gap: 16px;
            margin-bottom: 20px;
        }
        .stat-card {
            background: #fff;
            border-radius: 10px;
            padding: 20px;
            text-align: center;
            box-shadow: 0 2px 8px rgba(0,0,0,0.06);
        }
        .stat-card .number { font-size: 32px; font-weight: 700; color: #1890ff; }
        .stat-card .label { font-size: 14px; color: #666; margin-top: 4px; }
    </style>
</head>
<body>
    <nav class="navbar">
        <a href="/" class="logo">📊 全能<span>数据平台</span></a>
        <a href="/" class="{% if request.url.path == '/' %}active{% endif %}">首页</a>
        <a href="/crawler" class="{% if request.url.path == '/crawler' %}active{% endif %}">爬虫管理</a>
        <a href="/analysis" class="{% if request.url.path == '/analysis' %}active{% endif %}">数据分析</a>
        <a href="/dashboard" class="{% if request.url.path == '/dashboard' %}active{% endif %}">仪表盘</a>
    </nav>
    <div class="container">
        {% block content %}{% endblock %}
    </div>

    <script>
    async function apiPost(url, data) {
        const resp = await fetch(url, {
            method: 'POST',
            headers: { 'Content-Type': 'application/json' },
            body: JSON.stringify(data)
        });
        return await resp.json();
    }

    function showMessage(el, msg, type = 'info') {
        el.innerHTML = `<div class="alert alert-${type}">${msg}</div>`;
    }
    </script>
    {% block scripts %}{% endblock %}
</body>
</html>
