{% extends "base.html" %}
{% block content %}
<div class="stats-grid" id="statsGrid">
    <div class="stat-card"><div class="number">-</div><div class="label">原始数据文件</div></div>
    <div class="stat-card"><div class="number">-</div><div class="label">已处理文件</div></div>
    <div class="stat-card"><div class="number">-</div><div class="label">爬取成功</div></div>
    <div class="stat-card"><div class="number">-</div><div class="label">数据列数</div></div>
</div>

<div class="row">
    <div class="col">
        <div class="card">
            <h2>📋 最近爬取记录</h2>
            <div id="recentCrawls">加载中...</div>
        </div>
    </div>
    <div class="col">
        <div class="card">
            <h2>📈 实时摘要</h2>
            <canvas id="liveChart" width="500" height="300" style="width:100%;height:auto;max-width:500px;"></canvas>
        </div>
    </div>
</div>

<div class="card">
    <h2>🔧 系统状态</h2>
    <div id="systemStatus">加载中...</div>
</div>

<script>
async function loadDashboard() {
    try {
        const resp = await fetch('/api/dashboard/overview');
        const data = await resp.json();

        // 更新统计卡片
        const grid = document.getElementById('statsGrid');
        const cards = grid.querySelectorAll('.number');
        cards[0].textContent = data.data_stats?.raw_files?.total || 0;
        cards[1].textContent = data.data_stats?.processed_files?.total || 0;

        // 系统状态
        const statusDiv = document.getElementById('systemStatus');
        statusDiv.innerHTML = `
            <table>
                <tr><td>系统名称</td><td>${data.system?.name || '-'}</td></tr>
                <tr><td>版本</td><td>${data.system?.version || '-'}</td></tr>
                <tr><td>状态</td><td><span style="color:#52c41a;">●</span> ${data.system?.status || 'unknown'}</td></tr>
                <tr><td>原始数据目录</td><td>${data.data_stats?.raw_files?.path || '-'}</td></tr>
                <tr><td>已处理数据目录</td><td>${data.data_stats?.processed_files?.path || '-'}</td></tr>
            </table>
        `;

        // 最近爬取记录
        const recentResp = await fetch('/api/dashboard/recent-crawls?limit=5');
        const recentData = await recentResp.json();
        const recentDiv = document.getElementById('recentCrawls');
        if (recentData.results?.length > 0) {
            recentDiv.innerHTML = `<table>
                <tr><th>标题</th><th>状态</th><th>时间</th></tr>
                ${recentData.results.map(r => `<tr>
                    <td>${r.title || r.url?.substring(0, 30) || '-'}</td>
                    <td>${r.success ? '✅' : '❌'}</td>
                    <td>${new Date(r.time).toLocaleString() || '-'}</td>
                </tr>`).join('')}
            </table>`;
            cards[2].textContent = recentData.results.filter(r => r.success).length;
        } else {
            recentDiv.innerHTML = '<div class="alert alert-info">暂无爬取记录</div>';
        }
    } catch (e) {
        document.getElementById('systemStatus').innerHTML = '<div class="alert alert-error">加载失败</div>';
    }
}

// 绘制迷你仪表盘图表
function drawMiniChart() {
    const canvas = document.getElementById('liveChart');
    const ctx = canvas.getContext('2d');

    ctx.fillStyle = '#fff';
    ctx.fillRect(0, 0, canvas.width, canvas.height);

    const data = [12, 19, 8, 15, 25, 20, 30, 22, 18, 28, 24, 16];
    const labels = ['1月','2月','3月','4月','5月','6月','7月','8月','9月','10月','11月','12月'];

    // 网格
    ctx.strokeStyle = '#f0f0f0';
    ctx.lineWidth = 1;
    for (let y = 0; y < 6; y++) {
        ctx.beginPath();
        ctx.moveTo(40, 30 + y * 42);
        ctx.lineTo(470, 30 + y * 42);
        ctx.stroke();
        ctx.fillStyle = '#999';
        ctx.font = '10px sans-serif';
        ctx.textAlign = 'right';
        ctx.fillText(30 - y * 6, 35, 34 + y * 42);
    }

    // 折线
    ctx.beginPath();
    ctx.strokeStyle = '#1890ff';
    ctx.lineWidth = 2.5;
    data.forEach((v, i) => {
        const x = 50 + i * 36;
        const y = 270 - v * 7;
        if (i === 0) ctx.moveTo(x, y);
        else ctx.lineTo(x, y);
    });
    ctx.stroke();

    // 数据点
    data.forEach((v, i) => {
        const x = 50 + i * 36;
        const y = 270 - v * 7;
        ctx.beginPath();
        ctx.arc(x, y, 4, 0, 2 * Math.PI);
        ctx.fillStyle = '#1890ff';
        ctx.fill();
        ctx.fillStyle = '#333';
        ctx.font = '9px sans-serif';
        ctx.textAlign = 'center';
        ctx.fillText(v, x, y - 10);
    });

    // X轴标签
    labels.forEach((l, i) => {
        ctx.fillStyle = '#999';
        ctx.font = '9px sans-serif';
        ctx.textAlign = 'center';
        ctx.fillText(l, 50 + i * 36, 290);
    });

    // 图例
    ctx.fillStyle = '#1890ff';
    ctx.fillRect(200, 8, 12, 3);
    ctx.fillStyle = '#666';
    ctx.font = '10px sans-serif';
    ctx.textAlign = 'left';
    ctx.fillText('月数据量', 215, 12);
}

loadDashboard();
drawMiniChart();
</script>
{% endblock %}
