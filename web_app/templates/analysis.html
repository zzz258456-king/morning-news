{% extends "base.html" %}
{% block content %}
<div class="card">
    <h2>📊 数据分析</h2>
    <div style="margin-bottom:16px;">
        <label>示例数据来源</label>
        <select id="dataSource">
            <option value="sample">生成示例数据</option>
            <option value="upload">上传文件</option>
        </select>
    </div>
    <div style="display:flex; gap:12px; flex-wrap:wrap;">
        <button class="btn btn-primary" onclick="runAnalysis()">运行分析</button>
        <button class="btn btn-success" onclick="showChart()">生成可视化</button>
    </div>
    <div id="analysisResult" style="margin-top:16px;"></div>
</div>

<div class="card">
    <h2>📈 可视化</h2>
    <div class="form-group">
        <label>图表类型</label>
        <select id="chartType">
            <option value="line">折线图</option>
            <option value="bar">柱状图</option>
            <option value="pie">饼图</option>
            <option value="histogram">直方图</option>
            <option value="scatter">散点图</option>
            <option value="heatmap">热力图</option>
            <option value="box">箱线图</option>
        </select>
    </div>
    <div id="chartContainer" style="text-align:center; min-height:200px;">
        <div class="alert alert-info">请先运行分析生成数据</div>
    </div>
</div>

<div class="card">
    <h2>🤖 机器学习</h2>
    <div class="form-group">
        <label>目标列</label>
        <select id="targetCol">
            <option value="target">target</option>
        </select>
    </div>
    <div style="display:flex; gap:12px;">
        <button class="btn btn-primary" onclick="trainModel()">训练模型</button>
    </div>
    <div id="trainResult" style="margin-top:16px;"></div>
</div>

<script>
let sampleData = null;

function generateSampleData() {
    const rows = [];
    const categories = ['A', 'B', 'C', 'D', 'E'];
    for (let i = 1; i <= 30; i++) {
        rows.push({
            date: `2026-05-${String(i).padStart(2, '0')}`,
            value: Math.round(Math.random() * 100 + 50),
            category: categories[Math.floor(Math.random() * categories.length)],
            target: Math.random() > 0.5 ? 1 : 0,
            sales: Math.round(Math.random() * 500 + 100),
        });
    }
    return rows;
}

async function runAnalysis() {
    const resultDiv = document.getElementById('analysisResult');
    resultDiv.innerHTML = '<div class="loading">⏳ 分析中...</div>';

    sampleData = generateSampleData();
    const data = await apiPost('/api/analysis/analyze', {
        data: sampleData,
        operations: ['summary', 'describe', 'correlation']
    });

    if (!data.success) {
        resultDiv.innerHTML = `<div class="alert alert-error">${data.detail || '分析失败'}</div>`;
        return;
    }

    const summary = data.results.summary;
    let html = '<div class="alert alert-success">✅ 分析完成</div>';
    html += `<p>数据: ${summary.行数} 行 × ${summary.列数} 列 | 内存: ${summary['内存占用']}</p>`;
    html += '<table><tr><th>列名</th><th>类型</th><th>非空值</th><th>唯一值</th></tr>';
    for (const [col, info] of Object.entries(summary.各列信息)) {
        html += `<tr><td>${col}</td><td>${info.类型}</td><td>${info['非空值']}</td><td>${info.唯一值}</td></tr>`;
    }
    html += '</table>';
    resultDiv.innerHTML = html;
}

async function showChart() {
    const chartType = document.getElementById('chartType').value;
    const container = document.getElementById('chartContainer');
    container.innerHTML = '<div class="loading">⏳ 生成图表...</div>';

    if (!sampleData) sampleData = generateSampleData();

    const payload = {
        chart_type: chartType,
        source_file: null,
        title: `示例${chartType}图`
    };

    if (chartType === 'pie') {
        payload.x = 'category';
    } else if (chartType === 'histogram') {
        payload.x = 'value';
    } else if (chartType === 'heatmap' || chartType === 'box') {
        // pass through
    } else {
        payload.x = 'date';
        payload.y = chartType === 'scatter' ? 'value' : ['value', 'sales'];
    }

    // Use mock for demo (in real app this would call the API)
    const { createChart } = await import('data:application/javascript;base64,' + btoa(`
        export async function createMockChart() {
            return 'mock';
        }
    `)).catch(() => ({ createChart: null }));

    // Generate a simple inline visualization via canvas
    const canvas = document.createElement('canvas');
    canvas.width = 600;
    canvas.height = 360;
    canvas.style.maxWidth = '100%';
    canvas.style.borderRadius = '8px';
    canvas.style.border = '1px solid #f0f0f0';
    const ctx = canvas.getContext('2d');

    // Draw a simple chart based on type
    ctx.fillStyle = '#fff';
    ctx.fillRect(0, 0, canvas.width, canvas.height);

    ctx.fillStyle = '#333';
    ctx.font = '16px sans-serif';
    ctx.textAlign = 'center';
    ctx.fillText('${chartType.toUpperCase()} 图表 - 示例数据可视化', canvas.width / 2, 30);

    if (chartType === 'bar') {
        const data = [65, 78, 92, 55, 88, 70, 83];
        const colors = ['#1890ff', '#52c41a', '#faad14', '#ff4d4f', '#722ed1', '#13c2c2', '#eb2f96'];
        data.forEach((v, i) => {
            ctx.fillStyle = colors[i];
            ctx.fillRect(50 + i * 78, 320 - v * 2.5, 50, v * 2.5);
            ctx.fillStyle = '#333';
            ctx.font = '12px sans-serif';
            ctx.textAlign = 'center';
            ctx.fillText(v, 75 + i * 78, 310 - v * 2.5);
            ctx.fillText(['一','二','三','四','五','六','日'][i], 75 + i * 78, 350);
        });
    } else if (chartType === 'line') {
        ctx.beginPath();
        ctx.strokeStyle = '#1890ff';
        ctx.lineWidth = 2;
        for (let i = 0; i < 12; i++) {
            const x = 50 + i * 45;
            const y = 300 - Math.random() * 200;
            if (i === 0) ctx.moveTo(x, y);
            else ctx.lineTo(x, y);
        }
        ctx.stroke();
        ctx.strokeStyle = '#52c41a';
        ctx.beginPath();
        for (let i = 0; i < 12; i++) {
            const x = 50 + i * 45;
            const y = 280 - Math.random() * 180;
            if (i === 0) ctx.moveTo(x, y);
            else ctx.lineTo(x, y);
        }
        ctx.stroke();
        ctx.fillStyle = '#666';
        ctx.font = '12px sans-serif';
        ctx.fillText('← 数据趋势 →', canvas.width / 2, 350);
    } else if (chartType === 'pie') {
        const data = [30, 25, 20, 15, 10];
        const colors = ['#1890ff', '#52c41a', '#faad14', '#ff4d4f', '#722ed1'];
        let start = 0;
        data.forEach((v, i) => {
            const angle = (v / 100) * 2 * Math.PI;
            ctx.fillStyle = colors[i];
            ctx.beginPath();
            ctx.moveTo(200, 200);
            ctx.arc(200, 200, 120, start, start + angle);
            ctx.closePath();
            ctx.fill();
            ctx.fillStyle = '#333';
            ctx.font = '12px sans-serif';
            const mid = start + angle / 2;
            ctx.fillText(v + '%', 200 + Math.cos(mid) * 90, 200 + Math.sin(mid) * 90);
            start += angle;
        });
    } else {
        ctx.fillStyle = '#999';
        ctx.font = '14px sans-serif';
        ctx.fillText('选择其他图表类型查看不同效果', canvas.width / 2, canvas.height / 2);
    }

    container.innerHTML = '';
    container.appendChild(canvas);
}

async function trainModel() {
    const resultDiv = document.getElementById('trainResult');
    resultDiv.innerHTML = '<div class="loading">⏳ 训练模型中...</div>';

    const data = await apiPost('/api/analysis/train', {
        feature_cols: ['value', 'sales'],
        target_col: 'target',
        model_name: 'auto',
        task_type: 'classification',
        test_size: 0.2
    }).catch(() => null);

    if (data && data.success) {
        resultDiv.innerHTML = `
            <div class="alert alert-success">✅ 模型训练完成</div>
            <table>
                <tr><th>指标</th><th>值</th></tr>
                ${Object.entries(data.metrics || {}).map(([k,v]) =>
                    `<tr><td>${k}</td><td>${typeof v === 'number' ? v.toFixed(4) : JSON.stringify(v)}</td></tr>`
                ).join('')}
            </table>
        `;
    } else {
        resultDiv.innerHTML = `
            <div class="alert alert-info">模型训练API需要先上传数据文件。</div>
            <pre>请在爬虫页面爬取数据后重试，或直接查看上方图表示例。</pre>
        `;
    }
}
</script>
{% endblock %}
