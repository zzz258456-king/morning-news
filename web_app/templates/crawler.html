{% extends "base.html" %}
{% block content %}
<div class="card">
    <h2>🕷️ 网页爬取</h2>
    <div class="form-group">
        <label>目标 URL</label>
        <input type="url" id="crawlUrl" placeholder="https://example.com" value="https://httpbin.org/html">
    </div>
    <div style="display:flex; gap:12px; flex-wrap:wrap;">
        <button class="btn btn-primary" onclick="startCrawl()">开始爬取</button>
        <button class="btn btn-success" onclick="batchCrawl()">批量爬取示例</button>
    </div>
    <div id="crawlResult" style="margin-top:16px;"></div>
</div>

<div class="card">
    <h2>📄 已保存的爬取文件</h2>
    <div id="savedFiles">加载中...</div>
</div>

<div class="card">
    <h2>📋 爬取结果预览</h2>
    <div id="contentPreview" style="color:#999;">请先爬取一个页面</div>
</div>

<script>
async function startCrawl() {
    const url = document.getElementById('crawlUrl').value;
    const resultDiv = document.getElementById('crawlResult');
    const previewDiv = document.getElementById('contentPreview');
    resultDiv.innerHTML = '<div class="loading">⏳ 正在爬取...</div>';

    try {
        const data = await apiPost('/api/crawler/crawl', {
            url: url,
            extract_tables: true,
            extract_articles: true
        });
        resultDiv.innerHTML = `
            <div class="alert alert-success">✅ 爬取成功！</div>
            <table>
                <tr><th>属性</th><th>值</th></tr>
                <tr><td>标题</td><td>${data.title || '(无标题)'}</td></tr>
                <tr><td>URL</td><td style="word-break:break-all;">${data.url}</td></tr>
                <tr><td>内容长度</td><td>${data.content_length} 字符</td></tr>
                <tr><td>爬取时间</td><td>${data.crawled_at}</td></tr>
            </table>
        `;
        if (data.tables && data.tables.length > 0) {
            previewDiv.innerHTML = '<h3>提取的表格数据:</h3><pre>' +
                JSON.stringify(data.tables.slice(0, 5), null, 2) + '</pre>';
        } else if (data.articles && data.articles.length > 0) {
            previewDiv.innerHTML = '<h3>提取的文章列表:</h3>' +
                data.articles.map(a => `<div style="padding:8px 0;border-bottom:1px solid #f0f0f0;">
                    <strong>${a.title}</strong><br><small>${a.url}</small>
                </div>`).join('');
        } else {
            previewDiv.innerHTML = '<h3>页面文本摘要:</h3><pre>' +
                (data.content_length > 500 ? '内容较长，请查看保存的文件' : '已完成爬取') + '</pre>';
        }
        loadSavedFiles();
    } catch (err) {
        resultDiv.innerHTML = `<div class="alert alert-error">❌ 爬取失败: ${err.message}</div>`;
    }
}

async function batchCrawl() {
    const urls = [
        'https://httpbin.org/html',
        'https://httpbin.org/robots.txt',
        'https://httpbin.org/xml'
    ];
    const resultDiv = document.getElementById('crawlResult');
    resultDiv.innerHTML = '<div class="loading">⏳ 批量爬取中 (3个URL)...</div>';

    const data = await apiPost('/api/crawler/batch-crawl', { urls, max_workers: 3 });
    resultDiv.innerHTML = `
        <div class="alert alert-success">✅ 批量完成</div>
        <table>
            <tr><th>URL</th><th>状态</th><th>标题</th></tr>
            ${data.results.map(r => `<tr>
                <td style="word-break:break-all;">${r.url}</td>
                <td>${r.success ? '✅' : '❌'}</td>
                <td>${r.title || '-'}</td>
            </tr>`).join('')}
        </table>
        <p style="margin-top:8px;">成功: ${data.success_count} / 失败: ${data.fail_count}</p>
    `;
    loadSavedFiles();
}

async function loadSavedFiles() {
    try {
        const resp = await fetch('/api/crawler/saved-files');
        const data = await resp.json();
        const el = document.getElementById('savedFiles');
        if (data.files.length === 0) {
            el.innerHTML = '<div class="alert alert-info">暂无保存文件</div>';
            return;
        }
        el.innerHTML = `<table>
            <tr><th>文件名</th><th>大小</th></tr>
            ${data.files.map(f => `<tr>
                <td>${f.name}</td>
                <td>${(f.size / 1024).toFixed(1)} KB</td>
            </tr>`).join('')}
        </table>`;
    } catch (e) {
        document.getElementById('savedFiles').innerHTML = '<div class="alert alert-error">加载失败</div>';
    }
}

loadSavedFiles();
</script>
{% endblock %}
