name: DPPT Web Backend CI

env:
  # 强制 JavaScript action 在 Node 24 上运行；同时保留 Node 20 回退开关
  FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: true
  ACTIONS_ALLOW_USE_UNSECURE_NODE_VERSION: true

on:
  push:
    branches: [main, master]
    paths:
      - 'dppt-web/backend/**'
      - '.github/workflows/dppt-web-ci.yml'
  pull_request:
    branches: [main, master]
    paths:
      - 'dppt-web/backend/**'
      - '.github/workflows/dppt-web-ci.yml'

jobs:
  test:
    runs-on: ubuntu-24.04
    defaults:
      run:
        working-directory: dppt-web/backend

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4.2.2

      - name: Set up Python
        uses: actions/setup-python@v5.5.0
        with:
          python-version: '3.13'

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt

      - name: Run pytest
        run: pytest tests/ -v
        env:
          DATABASE_URL: sqlite:///./test_ci.db
          CELERY_BROKER_URL: memory://
          CELERY_RESULT_BACKEND: cache+memory://

  docker-build:
    runs-on: ubuntu-24.04
    needs: test
    defaults:
      run:
        working-directory: dppt-web/backend

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4.2.2

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3.10.0

      - name: Build Docker image
        run: docker build -t dppt-web-backend .

      - name: Validate docker-compose.yml
        run: docker compose config
