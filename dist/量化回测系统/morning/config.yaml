# ============================================
# 新闻晨报系统配置文件
# 敏感信息 (API Key / Webhook URL) 请放在 .env 中
# ============================================

# ---------- RSS 新闻源 ----------
rss_sources:
  - name: "财联社"
    url: "https://www.cls.cn/telegraph"
  - name: "华尔街见闻"
    url: "https://wallstreetcn.com/rss/global"
  - name: "东方财富"
    url: "https://finance.eastmoney.com/a/czqyw.html"
  - name: "36氪"
    url: "https://36kr.com/feed"
  # 可继续添加更多源：
  # - name: "虎嗅"
  #   url: "https://www.huxiu.com/rss/0.xml"

# ---------- AI 配置（DeepSeek / OpenAI 兼容格式） ----------
ai:
  # DeepSeek API 地址（兼容 OpenAI 格式）
  base_url: "https://api.deepseek.com/v1"
  # 模型名称
  model: "deepseek-chat"
  # 最大输出 token 数
  max_tokens: 4096
  # api_key: 请放在 .env 中 (DEEPSEEK_API_KEY)

# ---------- 钉钉机器人 ----------
dingtalk:
  title: "【晨报】📰 财经新闻晨报"
  # webhook_url: 请放在 .env 中 (DINGTALK_WEBHOOK_URL)
  # secret: 请放在 .env 中 (DINGTALK_SECRET)
