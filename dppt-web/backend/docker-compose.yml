services:
  db:
    image: postgres:15-alpine
    container_name: dppt-web-db
    environment:
      POSTGRES_USER: dppt
      POSTGRES_PASSWORD: dppt_secret
      POSTGRES_DB: dppt_web
    volumes:
      - dppt_db_data:/var/lib/postgresql/data
    ports:
      - "5432:5432"
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U dppt -d dppt_web"]
      interval: 5s
      timeout: 5s
      retries: 5

  backend:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: dppt-web-backend
    environment:
      DATABASE_URL: postgresql://dppt:dppt_secret@db:5432/dppt_web
    ports:
      - "8000:8000"
    depends_on:
      db:
        condition: service_healthy
    volumes:
      - dppt_output:/app/output
    command: ["uvicorn", "app.main:app", "--host", "0.0.0.0", "--port", "8000", "--reload"]

volumes:
  dppt_db_data:
  dppt_output:
